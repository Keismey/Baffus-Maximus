<style>
/* Mise en page : une "tablette de cire" portrait centrée sur fond de porphyre ; écrans empilés, un seul visible */
:root{
  --ink:#2A1A14; --ink2:#5A3E2E; --sable:#EBCF96; --sable2:#D9B371; --papyrus:#FBEFD2;
  --pourpre:#8E2436; --pourpre2:#B23A48; --or:#E9A93A; --laurier:#5B8C3A; --ciel:#3E78A8;
  --porphyre:#3B1A26; --porphyre2:#24101A; --blanc:#FFF8E8; --ombre:rgba(42,26,20,.25);
  --f-titre:'Lilita One','Arial Black',Impact,sans-serif;
  --f-corps:'Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--porphyre2);color:var(--ink);font-family:var(--f-corps);font-weight:700;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;display:flex;justify-content:center;align-items:stretch;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.05) 0 2px,transparent 3px) 0 0/38px 38px,
    radial-gradient(circle at 70% 60%,rgba(233,169,58,.07) 0 1.5px,transparent 2.5px) 0 0/27px 27px,
    linear-gradient(160deg,var(--porphyre),var(--porphyre2))}
#stage::before,#stage::after{content:'';position:absolute;top:0;bottom:0;width:calc(50% - 250px);pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(233,169,58,.08) 46px 50px)}
#stage::before{left:0}#stage::after{right:0}
#app{position:relative;width:100%;max-width:460px;height:100%;background:var(--sable);overflow:hidden;
  box-shadow:0 0 0 4px var(--ink),0 0 60px rgba(0,0,0,.6)}
@media (min-width:600px){#app{height:min(100%,920px);align-self:center;border-radius:18px}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
h1,h2,h3,.titre{font-family:var(--f-titre);font-weight:400;letter-spacing:.5px;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--ciel);outline-offset:2px}
.btn{font-family:var(--f-titre);font-size:20px;letter-spacing:.5px;padding:12px 18px;border-radius:14px;background:var(--pourpre);color:var(--blanc);
  border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.or{background:var(--or);color:var(--ink)}
.btn.vert{background:var(--laurier)}
.btn.bleu{background:var(--ciel)}
.btn.clair{background:var(--papyrus);color:var(--ink)}
.curseur{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink)}.curseur span{min-width:118px;text-align:left}.curseur input{flex:1;accent-color:#B8452E;height:28px}
.btn.petit{font-size:16px;padding:8px 12px;border-radius:11px}
.btn[disabled]{filter:grayscale(.8) brightness(.9);opacity:.6;pointer-events:none}
.plaque{background:var(--papyrus);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ombre)}

/* Splash */
#splash{background:#000;align-items:center;justify-content:center;z-index:50;transition:opacity .6s}
#splash img{width:min(62%,250px);opacity:0;animation:spIn 1s ease .15s forwards}
@keyframes spIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
#splash{flex-direction:column;gap:34px;cursor:pointer}
.sp-hint{font-family:var(--f-titre);font-size:20px;letter-spacing:1px;color:#E9DCC0;opacity:0;transition:opacity .5s}
#splash.pret .sp-hint{opacity:1;animation:spClign 1.6s ease-in-out .5s infinite}
@keyframes spClign{50%{opacity:.35}}

/* Titre */
#titre{align-items:center;justify-content:space-between;padding-block:40px 28px;padding-inline:20px;
  background:radial-gradient(ellipse at 50% 108%,var(--sable2) 0 38%,transparent 39%),linear-gradient(var(--ciel) 0,#7FB0D6 52%,var(--sable) 52%)}
#titre .logo{text-align:center;color:var(--blanc);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
#titre .logo .l1{font-family:var(--f-titre);font-size:clamp(40px,12vw,56px);line-height:.95;display:block}
#titre .logo .l2{font-family:var(--f-titre);font-size:clamp(22px,6vw,28px);color:var(--or);display:block;margin-top:6px}
#titre .sous{font-size:14px;color:var(--ink);background:var(--papyrus);border:2px solid var(--ink);border-radius:20px;padding:4px 12px;margin-top:12px;display:inline-block;text-shadow:none}
#titreCv{width:100%;max-width:360px;height:auto;aspect-ratio:1.4}
.titre-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%;z-index:0}
#titre.peint{background:#7FB0D6}#titre.peint #titreCv{visibility:hidden}#titre>*:not(.titre-bg){position:relative;z-index:1}
#titre .actions{display:flex;flex-direction:column;gap:12px;width:min(100%,300px)}
#titre .ver{font-size:12px;color:var(--ink2);margin-top:8px}

/* Ludus (accueil) */
#ludus{background:var(--sable)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--ink);color:var(--blanc);font-weight:800;font-size:15px}
.topbar .grp{display:flex;align-items:center;gap:6px}
.piece{width:20px;height:20px;display:inline-block;background:var(--i-piece,var(--or)) center/contain no-repeat;border-radius:50%}
.nrj{display:flex;gap:3px}
.nrj i{width:17px;height:17px;display:block;background:var(--i-pain) center/contain no-repeat;filter:grayscale(1) brightness(.45);opacity:.6}
.nrj i.on{filter:none;opacity:1}
.timer{font-size:12px;color:var(--sable2);font-variant-numeric:tabular-nums;white-space:nowrap}
.casques{display:flex;gap:2px}
.casques b{width:20px;height:20px;display:block;background:var(--i-casque) center/contain no-repeat}
.casques b.perdu{filter:grayscale(1) brightness(.4);opacity:.55}
.carte{display:flex;gap:10px;padding:10px 12px 6px;align-items:flex-end}
#portrait{width:118px;height:140px;flex:none;border-radius:14px;border:3px solid var(--ink);background:linear-gradient(#9CC4E4,#CFE3EF 60%,var(--sable2) 60%)}
.ident{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ident h2{font-size:23px;line-height:1.05}
.ident .gen{font-size:13px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:20px;border:2px solid var(--ink);background:var(--papyrus)}
.chip.trait{background:#F3D9E0}
.chip.passif{background:#DCEBCB}
.bulle{position:relative;background:var(--blanc);border:2px solid var(--ink);border-radius:12px;padding:6px 9px;font-size:13px;line-height:1.3;font-weight:700;font-style:italic;min-height:34px}
.bulle::before{content:'';position:absolute;left:-9px;bottom:10px;border:7px solid transparent;border-right-color:var(--ink)}
.stats{display:grid;gap:5px;padding:4px 12px 8px}
.st{display:grid;grid-template-columns:40px 1fr 64px;align-items:center;gap:8px;font-size:13px}
.st .lb{font-family:var(--f-titre);font-size:15px}
.barre{height:14px;border-radius:8px;background:#C9A86A;border:2px solid var(--ink);overflow:hidden;position:relative}
.barre i{position:absolute;inset:0 auto 0 0;display:block;border-radius:5px;transition:width .5s}
.st .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.st .v small{color:var(--ink2);font-weight:700}
.st.max .v{color:var(--laurier)}
.total{display:flex;justify-content:space-between;font-size:13px;padding:0 12px 6px;color:var(--ink2)}
.panneau{flex:1;overflow-y:auto;padding:10px 12px 16px;background:var(--sable2);border-top:3px solid var(--ink);-webkit-overflow-scrolling:touch}
.panneau h3{font-size:20px;margin-bottom:8px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{color:var(--sable);font-family:var(--f-titre);font-size:15px;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:4px solid transparent}
.nav button.on{color:var(--or);border-top-color:var(--or);background:#ffffff0d}
.nav svg{width:24px;height:24px}
.jeux{display:flex;flex-direction:column;gap:8px}
.jeu{display:flex;align-items:center;gap:12px;padding:9px 12px 9px 9px;text-align:left;background:var(--papyrus);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);position:relative;width:100%}
.jeu:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.jeu[disabled]{opacity:.55;pointer-events:none}
.jeu .ico{width:58px;height:58px;flex:none;border-radius:12px;background:#EAD3A2 center/78% no-repeat;border:2px solid var(--ink2)}
.jtx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.jeu b{font-family:var(--f-titre);font-weight:400;font-size:18px;line-height:1.1}
.jtx>span{font-size:12px;color:var(--ink2);line-height:1.25}
.jst{display:grid!important;grid-template-columns:34px 1fr auto;align-items:center;gap:7px;margin-top:3px}
.jst em{font-style:normal;font-family:var(--f-titre);font-size:14px}
.jst .barre{height:10px;display:block}
.jst small{font-size:12px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.jeu.plein::after{content:'Maxed';position:absolute;top:7px;right:9px;font-size:11px;background:var(--laurier);color:#fff;border-radius:6px;padding:1px 6px}
.vide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--papyrus);border:2px dashed var(--ink2);border-radius:12px;font-size:13.5px}
.ligue{padding:12px;display:flex;flex-direction:column;gap:10px}
.ligue .tete{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ligue .tete h3{margin:0}
.ligue .lieu{font-size:13px;color:var(--ink2)}
.marches{display:flex;gap:6px}
.marches i{flex:1;height:12px;border-radius:6px;background:#C9A86A;border:2px solid var(--ink)}
.marches i.ok{background:var(--laurier)}
.marches i.now{background:var(--or);animation:pulse 1.2s infinite}
.marches i.boss{border-radius:6px 6px 12px 12px}
@keyframes pulse{50%{filter:brightness(1.25)}}
.adv{display:flex;gap:10px;align-items:center;background:var(--blanc);border:2px solid var(--ink);border-radius:12px;padding:8px}
.adv canvas{width:64px;height:76px;flex:none}
.adv .nm{font-family:var(--f-titre);font-size:18px;line-height:1.1}
.adv .inf{font-size:12.5px;color:var(--ink2)}
.cote{font-size:13px;font-weight:800;padding:2px 8px;border-radius:8px;display:inline-block;margin-top:3px;color:var(--blanc)}
.ligues-liste{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.lg-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 10px;border-radius:10px;background:#ffffff55;border:2px solid #0002}
.lg-row.fait{background:#DCEBCB}
.lg-row.cur{border-color:var(--ink);background:var(--papyrus)}
.upg{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px}
.upg .ic{width:42px;height:42px;flex:none;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-titre);font-size:20px;color:var(--blanc)}
.upg .tx{flex:1;min-width:0}
.upg .tx b{font-family:var(--f-titre);font-weight:400;font-size:17px;display:block}
.upg .tx span{font-size:12.5px;color:var(--ink2);display:block;line-height:1.3}
.upg .niv{font-size:11.5px;color:var(--pourpre);font-weight:900}
.cout{display:inline-flex;align-items:center;gap:4px}
.cout .piece{width:16px;height:16px}
.anc{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.anc b{font-family:var(--f-titre);font-weight:400;font-size:16px}
.anc .r{text-align:right;color:var(--ink2);font-size:12px}
.sec{font-family:var(--f-titre);font-size:18px;margin:14px 0 6px}
.note{font-size:12.5px;color:var(--ink2);line-height:1.35}
.score-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 10px;margin-bottom:6px;font-size:13px}
.score-row .rk{font-family:var(--f-titre);font-size:20px;color:var(--pourpre)}

.engr{width:30px;height:30px;margin-left:4px;background:var(--i-engr) center/contain no-repeat}.engr svg{display:none}
.cour{flex:1;min-height:0;position:relative}
#courCv{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
.barreG{position:relative;display:flex;align-items:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--papyrus);border-top:3px solid var(--ink);text-align:left}
.bgN{display:flex;flex-direction:column;min-width:0;flex:1}
.bgN b{font-family:var(--f-titre);font-weight:400;font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgN span{font-size:12px;color:var(--ink2)}
.mini{display:grid;grid-template-columns:repeat(5,34px);gap:5px}
.mini div{display:flex;flex-direction:column;align-items:center;gap:1px}
.mini span{font-family:var(--f-titre);font-size:11px}
.mini b{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.mini i{display:block;width:100%;height:5px;border-radius:3px;background:#C9A86A;overflow:hidden}
.mini em{display:block;height:100%}
#voile{position:absolute;inset:0;z-index:5;background:rgba(36,16,26,.28)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:76%;display:flex;flex-direction:column;background:var(--sable2);border-top:3px solid var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.3);z-index:6;animation:monte .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes monte{from{transform:translateY(30%);opacity:.5}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 8px}
.sheet-h h3{font-size:22px}
.sheet .x{width:42px;height:42px;flex:none;background:var(--i-fermer) center/contain no-repeat;color:transparent;font-size:0}
.sheet .panneau{border-top:0;background:none;padding-top:2px;min-height:0}
.fiche-t{display:flex;gap:12px;align-items:flex-end;margin-bottom:8px}
#ficheCv{width:100px;height:120px;flex:none;border:3px solid var(--ink);border-radius:14px;background:linear-gradient(#9CC4E4,#CFE3EF 62%,#E2BC7E 62%)}
.sheet .stats{padding:4px 0 8px}.sheet .total{padding:0 0 8px}
.prime{display:flex;flex-direction:column;gap:2px;background:var(--blanc);border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:13.5px}
.pr-l{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.pr-l b{font-weight:900;white-space:nowrap}
.pr-l.moins{color:var(--pourpre);font-size:12.5px}
.pr-l.net{border-top:2px dashed var(--ink2);margin-top:4px;padding-top:5px;font-size:15px}
.pr-l.net b{font-family:var(--f-titre);font-weight:400;font-size:20px;display:flex;align-items:center;gap:5px}
.panneau.fondu-bas{-webkit-mask-image:linear-gradient(#000 calc(100% - 56px),transparent);mask-image:linear-gradient(#000 calc(100% - 56px),transparent)}
.panneau.fondu-haut{-webkit-mask-image:linear-gradient(transparent,#000 56px);mask-image:linear-gradient(transparent,#000 56px)}
.panneau.fondu-deux{-webkit-mask-image:linear-gradient(transparent,#000 56px,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(transparent,#000 56px,#000 calc(100% - 56px),transparent)}
.sheet{--hh:58px}.defil.haut{bottom:auto;top:calc(var(--hh) + 4px)}
.defil{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:40px;height:40px;border-radius:50%;background:var(--or);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:15px;color:var(--ink);animation:rebond 1.2s ease-in-out infinite;z-index:2}
@keyframes rebond{50%{transform:translate(-50%,5px)}}
.mini-st{padding:0 0 10px;gap:4px}.mini-st .st{grid-template-columns:36px 1fr 58px;font-size:12px}.mini-st .barre{height:11px}
.fichepers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fichepers div{background:var(--blanc);border:2px solid var(--ink);border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;min-width:0}
.fichepers span{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.fichepers b{font-size:13px;line-height:1.25}
.devise{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--blanc);border:2px solid var(--ink);border-radius:12px;padding:8px}
.devise b{font-family:var(--f-titre);font-weight:400;font-size:19px;color:var(--pourpre)}
.devise span{font-size:13px;font-style:italic}
.aide{width:30px;height:30px;border-radius:50%;background:var(--ciel);color:#fff;border:3px solid var(--ink);font-family:var(--f-titre);font-size:17px;box-shadow:0 2px 0 var(--ink)}
.liste-p{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;background:var(--blanc);border:2px solid var(--ink);border-radius:10px;padding:8px}
.liste-p div{display:flex;flex-direction:column;font-size:12.5px}.liste-p b{font-size:13.5px}

/* Mini-jeu & combat */
#mg,#combat{background:var(--ink);z-index:10}
#mgCv,#cbCv{display:block;width:100%;flex:1;min-height:0;touch-action:none}

.carton{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(36,16,26,.55);z-index:5}
.carton .plaque{width:min(100%,370px);padding:18px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}

.regle{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}

.gains{display:flex;flex-direction:column;gap:6px}

.gain b{font-family:var(--f-titre);font-weight:400;font-size:20px}
.cbhp{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 12px;color:var(--blanc)}
.cbhp .nm{font-family:var(--f-titre);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbhp .hp{height:14px;border-radius:7px;background:#4a2f2a;border:2px solid #000;overflow:hidden;margin-top:3px}

#cbLog{height:92px;overflow:hidden;padding:6px 12px;color:var(--sable);font-size:13px;line-height:1.45;background:#1a0f0c;display:flex;flex-direction:column;justify-content:flex-end}

<script>
/*CORE_START*/
const STATS=['for','res','vit','esq','pre'];
const SI={
  for:{nom:'Strength',c:'STR',col:'#C2452D',jeu:'sac'},
  res:{nom:'Toughness',c:'TGH',col:'#7A5230',jeu:'poisson'},
  vit:{nom:'Speed',c:'SPD',col:'#3E78A8',jeu:'course'},
  esq:{nom:'Evasion',c:'EVA',col:'#5B8C3A',jeu:'esquive'},
  pre:{nom:'Accuracy',c:'ACC',col:'#8E2436',jeu:'couteau'}
};
const BASE_CAP=30, BASE_STAT=5, CAP_MAX=400, CAP_PICK=18, CAP_OTHER=5;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
const sum=s=>STATS.reduce((t,k)=>t+s[k],0);

const PASSIFS={
  poigne:{nom:'Iron Grip',d:'+12% damage dealt.',w:10},
  cuir:{nom:'Leather Hide',d:'−10% damage taken.',w:10},
  plume:{nom:'Light Feet',d:'The opponent has −6% chance to hit.',w:10},
  lynx:{nom:'Eagle Eye',d:'+10% critical hit chance.',w:10},
  souffle:{nom:'Second Wind',d:'Once per fight, survives a fatal blow with 1 HP.',w:8},
  premier:{nom:'First Blood',d:'His first attack of the fight deals double damage.',w:9},
  rancune:{nom:'Grudge Holder',d:'+30% damage below 35% HP.',w:9},
  vif:{nom:'Quicksilver',d:'Starts the fight one step ahead.',w:9},
  bouclier:{nom:'Rusty Shield',d:'10% chance to block a hit completely.',w:8},
  sangsue:{nom:'Leech',d:'Recovers 15% of the damage he deals.',w:8},
  appetit:{nom:'Big Appetite',d:'+1 training session per run.',w:8},
  studieux:{nom:'Studious',d:'+15% training gains.',w:8},
  radin:{nom:'Penny-Pincher',d:'+25% sesterces earned.',w:8},
  increvable:{nom:'Unkillable',d:'Retires after 4 defeats instead of 3.',w:3}
};
function tirePassif(r=Math.random,excl=[]){
  const ks=Object.keys(PASSIFS).filter(k=>!excl.includes(k));
  let t=ks.reduce((a,k)=>a+PASSIFS[k].w,0),x=r()*t;
  for(const k of ks){x-=PASSIFS[k].w;if(x<=0)return k}
  return ks[0];
}

/* Ligues : total de stats adverse par combat */
const LIGUES=[
  {nom:'Farmers’ League',lieu:'Goosebury Arena',f:[35,55,80],boss:'Fabius and his Pitchfork'},
  {nom:'Provincial League',lieu:'Amphitheatre of Nemausus',f:[105,125,150],boss:'The Unmotivated Governor'},
  {nom:'Capua League',lieu:'Great Arena of Capua',f:[175,200,225,252],boss:'Spartacus, Cousin of Spartacus'},
  {nom:'Imperial League',lieu:'Circus of Ravenna',f:[285,315,345,378],boss:'The Prefect in a Bathrobe'},
  {nom:'Colosseum League',lieu:'The Colosseum',f:[410,440,470,505,545],boss:'Maximus Maximissimus'}
];
const cycleMult=c=>1+0.35*(c-1);
const totalAdv=(L,i,c)=>Math.round(LIGUES[L].f[i]*cycleMult(c));

function statsAdv(total,arch,r=Math.random){
  const w=ARCH[arch].w,ws={};let t=0;
  STATS.forEach(k=>{ws[k]=w[k]*(0.8+r()*0.4);t+=ws[k]});
  const s={};STATS.forEach(k=>s[k]=Math.max(2,Math.round(total*ws[k]/t)));
  return s;
}

/* ===== Combat ===== */
function mkF(stats,passive,hpm=1){
  const s={...stats};
  const hp=Math.round((60+s.res*5)*hpm);
  return {s,hp,hpMax:hp,rate:15+s.vit,atb:passive==='vif'?80:0,p:passive||null,souffle:false,first:true};
}
function chanceToucher(A,D){
  return clamp(0.75*Math.pow((A.s.pre+15)/(D.s.esq+15),0.8)-(D.p==='plume'?0.06:0),0.25,0.97);
}
function simuler(PS,PP,ES,EP,r=Math.random,hpm=[1,1]){
  const F=[mkF(PS,PP,hpm[0]),mkF(ES,EP,hpm[1])],ev=[];let n=0;
  while(F[0].hp>0&&F[1].hp>0&&n<400){
    n++;
    const t0=(100-F[0].atb)/F[0].rate,t1=(100-F[1].atb)/F[1].rate;
    const i=t0<=t1?0:1,dt=Math.max(0,Math.min(t0,t1));
    F[0].atb+=F[0].rate*dt;F[1].atb+=F[1].rate*dt;F[i].atb-=100;
    const A=F[i],D=F[1-i],e={a:i};
    const first=A.first;A.first=false;
    if(r()>chanceToucher(A,D)){e.t='rate'}
    else if(D.p==='bouclier'&&r()<0.1){e.t='bloque'}
    else{
      const crit=r()<0.05+0.15*A.s.pre/(A.s.pre+D.s.esq+30)+(A.p==='lynx'?0.1:0);
      let d=(8+A.s.for)*(0.85+r()*0.3);
      if(crit)d*=1.7;
      if(A.p==='poigne')d*=1.12;
      if(A.p==='premier'&&first)d*=2;
      if(A.p==='rancune'&&A.hp<A.hpMax*0.35)d*=1.3;
      if(D.p==='cuir')d*=0.9;
      d=Math.max(1,Math.round(d));
      D.hp-=d;e.t='coup';e.d=d;e.crit=crit;
      if(A.p==='premier'&&first)e.premier=true;
      if(A.p==='sangsue'){const h=Math.round(d*0.15);A.hp=Math.min(A.hpMax,A.hp+h);if(h)e.soin=h}
      if(D.hp<=0&&D.p==='souffle'&&!D.souffle){D.hp=1;D.souffle=true;e.souffle=true}
    }
    e.hp=[Math.max(0,F[0].hp),Math.max(0,F[1].hp)];
    ev.push(e);
  }
  let w;
  if(F[0].hp<=0)w=1;else if(F[1].hp<=0)w=0;else w=F[0].hp/F[0].hpMax>=F[1].hp/F[1].hpMax?0:1;
  return {w,ev,hpMax:[F[0].hpMax,F[1].hpMax]};
}

/* ===== Entraînement ===== */
/* Chaque séance réussie apporte ~1/3 de la plage (plafond − base) de la stat travaillée :
   15 séances (3 séries de 5) suffisent à tout maxer si l'on joue bien. */
function gainsEntrainement(stat,q,caps,mult,stats,base,r=Math.random){
  const plage=k=>Math.max(3,caps[k]-base);
  const g=Math.max(1,Math.round(plage(stat)/4.3*(0.3+0.7*q)*mult*(q>=0.95?1.15:1)));
  const libres=STATS.filter(k=>k!==stat&&stats[k]<caps[k]);
  const s2=pick(libres.length?libres:STATS.filter(k=>k!==stat),r);
  const g2=q<0.15?0:Math.max(1,Math.round(plage(s2)/4.3*0.3*q*mult));
  return {stat,g,s2,g2};
}

function nouveauGladiateur(passif){
  const f=S.fam;f.gen++;
  const trait=pick(Object.keys(TRAITS));
  const st={};STATS.forEach(k=>st[k]=Math.min(f.caps[k],BASE_STAT+2*S.upg.statue));
  S.g={prenom:pick(PRENOMS),gen:f.gen,stats:st,trait,passif:passif||tirePassif(),look:looksAlea(trait),
    trains:0,wins:0,defaites:0,nrj:0,serie:1,festin:false,L:0,f:0,adv:null,meilleure:0,ligueGagnees:0,fiche:nouvelleFiche()};
  S.g.nrj=nrjMax();

}
function migrer(){
  if(!S.fam)return;
  if(!S.fam.tunique){S.fam.tunique=S.g.look.tunique;S.fam.bouclier=S.g.look.bouclier}
  if(!S.fam.traces)S.fam.traces={};
  if(S.fam.devise==null){S.fam.devise=rint(0,DEVISES.length-1);S.fam.origine=rint(0,ORIGINES.length-1);S.fam.fait=rint(0,FAITS.length-1)}
  if(S.g&&!S.g.fiche)S.g.fiche=nouvelleFiche();
  if(S.introVue==null)S.introVue=true;
  if(!S.rival){const t=S.fam.tunique;S.rival={nom:pick(RIVAUX),gen:0,prenom:null,arch:pick(Object.keys(ARCH)),tunique:pick(TUNIQUES.filter(x=>x!==t)),plumet:'#2A1A14',bouclier:'#3B3B3B',casque:rint(0,2),peau:'#E0A97E',vic:0,def:0,passif:null,trait:'fanfaron'}}
  if(S.g&&S.g.serie==null){S.g.serie=1+S.g.defaites;S.g.festin=false;S.g.nrj=Math.min(S.g.nrj,nrjMax())}
  if(S.g)S.g.adv=null;
  UPG.forEach(x=>{if(S.upg[x.k]>x.max)S.upg[x.k]=x.max});
  if(!S.trophees)S.trophees=[];
  if(S.guide==null)S.guide=(S.g&&(S.g.trains>0||S.fam.gen>1))?'fini':'entr';
}
const niveauDiff=()=>Math.min(4,(S.g?S.g.L:0)+(S.cycle-1));

const FRAIS=['Lanista’s commission','Entry fee','Arena sand maintenance','Imperial slap tax','Sword rental','Grandstand cleaning','Flying tomato insurance','Lions’ pension fund','Tax on oversized plumes','Tip for the commentator','Paperwork fee','Contribution to the Emperor’s feast','Fine for excessive panache','Gladiator Weekly subscription','Shield repair (scratched)','“Voluntary” donation to the senator'];
function primeHumour(net,titre='Victory bonus'){
  const brut=Math.max(net*25,Math.round(net*(30+R()*60)/100)*100);
  const fr=FRAIS.slice().sort(()=>R()-.5).slice(0,3+Math.floor(R()*2));
  let reste=brut-net;const parts=fr.map((nom,i)=>{const v=i===fr.length-1?reste:Math.round(reste*(.25+R()*.35));reste-=v;return [nom,v]});
  return `<div class="prime"><div class="pr-l"><span>${titre}</span><b>${fmt(brut)}</b></div>${parts.map(([n,v])=>`<div class="pr-l moins"><span>${n}</span><b>−${fmt(v)}</b></div>`).join('')}<div class="pr-l net"><span>What you keep</span><b><span class="piece"></span> ${fmt(net)}</b></div></div>`;
}

/* Fond peint en mode "cover", calé pour que la hauteur v de l'image tombe à y (dans les limites) */
function fondTr(k,W,H,v=.5,y=H*.5){const im=IMG[k];if(!im)return null;const s=Math.max(W/im.width,H/im.height),dw=im.width*s,dh=im.height*s,ox=(W-dw)/2,oy=Math.min(0,Math.max(H-dh,y-v*dh));return {im,s,dw,dh,ox,oy,P:(x,y)=>[ox+x*s,oy+y*s]}}
function fondImg(c,k,W,H,v=.5,y=H*.5){
  const T=fondTr(k,W,H,v,y);if(!T)return false;sprite(c,T.im,T.ox,T.oy,T.dw,T.dh);return true;
}
/* Redessine une partie du décor (polygone en pixels de l'image) par-dessus les personnages : avant-plan */
function avantPlan(c,k,W,H,v,y,polys){
  const T=fondTr(k,W,H,v,y);if(!T)return;c.save();c.beginPath();
  for(const p of polys){p.forEach(([x,yy],i)=>{const[X,Y]=T.P(x,yy);i?c.lineTo(X,Y):c.moveTo(X,Y)});c.closePath()}
  c.clip();sprite(c,T.im,T.ox,T.oy,T.dw,T.dh);c.restore();
}

/* ===== La Gazette du Forum ===== */
const PUBS=['FOR SALE: shield, barely used, never used for blocking.','WANTED: intern for knife-throwing wheel. Courage required, insurance not provided.','LOST: one goose. If found, please keep it.','TO LET: gladiator tunic, size “heroic”, smell included.','READINGS: Madame Fortuna reads the future in lentils. Results not guaranteed.','OFFER: lessons in falling gracefully. First lesson free, the rest too if you land well.','FREE TO A GOOD HOME: very tired punching bag. Please don’t hit it, it’s sensitive.','WANTED: fishmonger with strong arms. Throwing experience required.'];
const METEO=['Tomato showers over the senators’ box.','Sunny skies over the arena, chance of slaps later in the day.','Westerly wind with a strong smell of mackerel.','Fog over the Forum. All bets are off.','Heatwave: the lions refuse to come out.'];
function gazette(g,f){
  const nom=`${g.prenom} ${f.nom}`,lg=LIGUES[Math.min(4,g.L)].nom,best=Math.max(0,...f.anc.slice(0,-1).map(a=>a.L));
  const T=[];
  if(g.wins===0)T.push([`${nom}: zero wins, but what style!`,`The crowd will mostly remember the way he fell, hailed by critics as “almost artistic”.`]);
  if(g.parRival)T.push([`Humiliated by a ${S.rival.nom}: House ${f.nom} demands a rematch`,`The matter has reached the Senate, which promises to discuss it after its nap.`]);
  if(g.L>best&&f.anc.length>1)T.push([`Family record! ${g.prenom} goes further than all his ancestors`,`The busts in the family temple were reportedly seen smiling. The sculptor denies it.`]);
  if(g.L===0)T.push([`${g.prenom} falls at the very first league: Fabius and his pitchfork rejoice`,`“He meant well,” says a farmer, before going back to his turnips.`]);
  if(g.dernierVainqueur)T.push([`${g.dernierVainqueur} ends the career of ${g.prenom}`,`The winner dedicated his victory “to his mum and his hairdresser”.`]);
  if((f.traces||{}).oie)T.push([`Goose spotted at the ${f.nom} ludus: neighbours worried`,`The animal allegedly bit two tax collectors. The family calls it a “misunderstanding”.`]);
  T.push([`${nom} hangs up his sword after ${g.wins} win${g.wins!==1?'s':''}`,`Having made it to the ${lg}, he leaves the arena to polite applause and a few vegetables.`]);
  const [titre,chapo]=pick(T);
  return `<div class="gazette"><div class="gz-tete"><span>No. ${f.gen*7+f.anc.length} · ${pick(['Morning edition','Evening edition','Special edition'])}</span><b>The Forum Gazette</b><span>The only paper the lions read · 1 sesterce</span></div>
    <h3 class="gz-titre">${esc(titre)}</h3><p class="gz-chapo">${esc(chapo)}</p>
    <div class="gz-cols"><div><p>${esc(g.prenom)}, ${TRAITS[g.trait].nom.toLowerCase()} by reputation, retires with <b>${g.wins} win${g.wins!==1?'s':''}</b> and <b>${g.trains} training session${g.trains!==1?'s':''}</b>. According to our sources, he ${g.reconv}.</p><p class="gz-cit">“${esc(ligne('ret',g))}”</p></div>
    <div class="gz-pub"><b>Classifieds</b><p>${esc(pick(PUBS))}</p><b>Weather</b><p>${esc(pick(METEO))}</p></div></div></div>`;
}

function jourAuj(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function defiDuJour(){
  const j=jourAuj();if(!S.defi||S.defi.jour!==j){let h=0;for(const ch of j)h=(h*31+ch.charCodeAt(0))|0;S.defi={jour:j,k:STATS[Math.abs(h)%5],fait:false}}
  return S.defi;
}
const primeDefi=()=>Math.round((40+35*(S.g?S.g.L:0))*(1+.5*(S.cycle-1))*multSest());

function statsCombat(a){
  const g=S.g,T=TACT[g.tactique||'prudent'],k=T.bon.includes(a.arch)?1.04:T.mau.includes(a.arch)?.97:1,o={};
  STATS.forEach(x=>o[x]=Math.max(1,Math.round(g.stats[x]*(T.m[x]||1)*k)));return o;
}

/* ===== Tutoriel guidé (première partie) ===== */
const GUIDE={
  entr:{t:'Tap the training ground for your first session.',z:'entr'},
  serie:{t:'Well done! Use up all your sessions, then head to the arena.',z:'entr'},
  arene:{t:'Out of sessions: tap the arena to fight!',z:'arene'},
  ludus:{t:'You can afford to upgrade your ludus: upgrades stay for all generations.',z:'ludus'}
};
function guideEtape(){
  const G=S.guide;if(!G||G==='fini'||!S.g)return null;
  if(G==='entr'||G==='jeu')return G==='entr'?'entr':null;
  if(G==='serie')return S.g.nrj>0?'serie':'arene';
  if(G==='arene')return 'arene';
  if(G==='ludus')return 'ludus';
  return null;
}
function guideAvance(ev){
  const G=S.guide;if(!G||G==='fini')return;
  if(G==='entr'&&ev==='panneau:entr')S.guide='jeu';
  else if(G==='jeu'&&ev==='mg')S.guide='serie';
  else if((G==='serie'||G==='arene')&&ev==='panneau:arene')S.guide='consigne';
  else if(G==='consigne'&&ev==='combat')S.guide='attente';
  else if(G==='attente'&&ev==='achat')S.guide='fini';
  else if(G==='ludus'&&ev==='panneau:ludus')S.guide='fini';
  sauver();majGuide();
}
function guideTick(){
  if(S.guide==='attente'&&UPG.some(x=>S.upg[x.k]<x.max&&S.sest>=coutUpg(x,S.upg[x.k]))){S.guide='ludus';sauver()}
}
function majGuide(){
  const el=$('guide');if(!el)return;const e=guideEtape();
  if(e&&!onglet&&!$('ludus').hidden){el.textContent=GUIDE[e].t;el.hidden=false}else el.hidden=true;
}
function dessinGuide(c,V,s,t){
  const e=guideEtape();if(!e||onglet)return;const sg=(COUR.signs||{})[GUIDE[e].z];if(!sg)return;const x=sg.x,y=sg.y,b=Math.sin(t*5)*6*s;
  c.save();c.translate(x,y-26*s+b);c.fillStyle='#FFD34D';c.strokeStyle=INK;c.lineWidth=3;c.lineJoin='round';
  c.beginPath();c.moveTo(0,0);c.lineTo(-13*s,-16*s);c.lineTo(-5*s,-16*s);c.lineTo(-5*s,-32*s);c.lineTo(5*s,-32*s);c.lineTo(5*s,-16*s);c.lineTo(13*s,-16*s);c.closePath();c.fill();c.stroke();c.restore();

function appliquerGains(k,q,d=0){
  const g=S.g,r=gainsEntrainement(k,q,S.fam.caps,multEntr()*(1+.04*d),g.stats,BASE_STAT+2*S.upg.statue);
  const avant1=g.stats[k],avant2=g.stats[r.s2];
  g.stats[k]=Math.min(S.fam.caps[k],g.stats[k]+r.g);
  g.stats[r.s2]=Math.min(S.fam.caps[r.s2],g.stats[r.s2]+r.g2);
  g.trains++;S.fam.trains++;g.nrj=Math.max(0,g.nrj-1);
  sauver();
  return {k,g:g.stats[k]-avant1,s2:r.s2,g2:g.stats[r.s2]-avant2,cap:g.stats[k]>=S.fam.caps[k]};
}

function champion(){

  S.board.push({nom:nomComplet(),cycle:S.cycle,gen:g.gen,perso:g.trains,lignee:f.trains,date:Date.now()});
  S.ancien={nom:nomComplet(),look:{...g.look},passif:g.passif,trait:g.trait};
  const bonus=Math.round(500*S.cycle*multSest());S.sest+=bonus;sauver();sfx('gain');musique('victoire');
  modal(`<h2>Colosseum champion!</h2><p><b>${esc(nomComplet())}</b> wins all five leagues after ${g.gen} generation${g.gen!==1?'s':''} and ${fmt(f.trains)} lineage training sessions.</p><div class="bulle" style="margin-left:10px">“${esc(ligne('vic'))}”</div><div class="gain"><span>Emperor’s bonus</span><b>+${fmt(bonus)}</b></div><p>A new dynasty begins: new family, tougher leagues (+${Math.round(cycleMult(S.cycle+1)*100-100)}%), but your ludus keeps all its upgrades. And in the Colosseum final, your champion will be waiting for you.</p><button class="btn or" id="bNewD">Found a new dynasty</button>`,m=>{
    m.querySelector('#bNewD').onclick=()=>{S.cycle++;nouvelleFamille();nouveauGladiateur(tirePassif());sauver();fermerModal();fermerPanneau();presentation()}
  });
}

  const p={entr:.1,ligue:.45,defaite:.18}[quand];

      if(e.crit&&R()<.35)setTimeout(()=>this.log(`<i>${pick(COMMENT.crit)}</i>`),200);

      if(e.souffle){this.log(`<b>${esc(nD)}</b> refuses to fall! Second wind!`);floatTxt(this.fl,'Second wind!',xD,H*.3,'#9BD07A',22)}
    }
    this.majHP();
  },
  boucle(ts){
    if(!this.actif)return;
    const dt=Math.min(.05,(ts-this.last)/1000);this.last=ts;
    const {c,W,H}=fitCanvas($('cbCv'));this._W=W;this._H=H;
    const ev=this.res.ev,D=.8;
    this.t+=dt*this.v;
    for(let i=0;i<2;i++){this.pt[i]-=dt*this.v;if(this.pt[i]<=0&&this.pose[i]!=='KO')this.pose[i]='idle';this.dodge[i]=Math.max(0,this.dodge[i]-dt*this.v)}
    let off=[0,0];
    if(this.i<ev.length){
      if(this.t>=0){const e=ev[this.i],p=this.t/D;
        const k=p<.45?Math.sin(p/.45*Math.PI/2):p<.6?1:Math.cos((p-.6)/.4*Math.PI/2);
        off[e.a]=k*W*.2*(e.a===0?1:-1);this.pose[e.a]=p<.6&&p>.25?'attack':'idle';
        if(p>=.45&&!e._ok){e._ok=true;this.appliquer(e)}
        if(p>=1){this.i++;this.t=0}
      }
    }else if(this.finT<0){this.finT=ts;this.pose[this.res.w===0?1:0]='KO';this.pt=[9,9];sfx(this.res.w===0?'gain':'perdu');floatTxt(this.fl,this.res.w===0?'VICTORY!':'DEFEAT…',W/2,H*.25,this.res.w===0?'#E9A93A':'#E86A5A',38)}
    this.dessiner(c,W,H,ts/1000,off,dt);
    if(this.finT>=0&&ts-this.finT>1400){this.actif=false;this.fin();return}
    requestAnimationFrame(t=>this.boucle(t));
  },
  dessiner(c,W,H,t,off,dt){
    c.save();if(this.shake>0){this.shake-=dt;c.translate((R()-.5)*10,(R()-.5)*6)}
    const sol=H*.55;
    if(!fondImg(c,'arene',W,H,.78,H*.74)){
    c.fillStyle='#B98A5E';c.fillRect(0,0,W,sol);
    c.fillStyle='#8C5F3E';for(let i=0;i<4;i++)c.fillRect(0,i*sol/4,W,3);
    for(const f of this.foule){const x=f.x*W,y=6+f.y*(sol-30),bob=Math.sin(t*4+f.p)*2;c.fillStyle=f.c;c.beginPath();c.arc(x,y+bob,5,0,7);c.fill();c.fillStyle='#E0A97E';c.beginPath();c.arc(x,y+bob-7,4,0,7);c.fill()}
    c.fillStyle='#D9B371';c.fillRect(0,sol-22,W,22);c.strokeStyle=INK;c.lineWidth=3;c.strokeRect(-2,sol-22,W+4,22);
    for(let i=0;i<5;i++){const x=W*(.1+i*.2);c.fillStyle=i%2?'#8E2436':'#E9A93A';c.beginPath();c.moveTo(x-12,sol-22);c.lineTo(x+12,sol-22);c.lineTo(x+12,sol-2);c.lineTo(x,sol-8);c.lineTo(x-12,sol-2);c.closePath();c.fill();c.stroke()}
    c.fillStyle='#E9C98B';c.fillRect(0,sol,W,H-sol);
    c.fillStyle='rgba(120,80,40,.18)';for(let i=0;i<30;i++)c.fillRect((i*137)%W,sol+((i*71)%(H-sol)),4,2);
    }
    const s=Math.min(H*.3/100,W*.0042),y=H*.725;
    const hP=95*s*1.2,fin=this.finT>=0;
    const GP={idle:'g_garde',attack:'g_fente',hurt:'g_recul',block:'g_garde',KO:'g_ko'};
    const x0=W*.28+off[0]-this.dodge[0]*W*.15,x1=W*.72+off[1]+this.dodge[1]*W*.15;
    const k0=fin&&this.res.w===0?'g_victoire':GP[this.pose[0]]||'g_garde';
    if(!perso(c,k0,x0,y,hP,{t:S.g.look,alpha:this.pose[0]==='hurt'&&Math.floor(t*20)%2?.55:1}))dessinGlad(c,x0,y,s,S.g.look,{pose:this.pose[0],t,joie:fin&&this.res.w===0});
    const L=this.La,p1=this.pose[1];
    if(L.spr&&IMG[L.spr]){const rot=p1==='attack'?-.14:p1==='hurt'?.12:p1==='KO'?1.45:fin&&this.res.w===1?Math.sin(t*8)*.06:Math.sin(t*2.2)*.02;perso(c,L.spr,x1,y-(fin&&this.res.w===1?Math.abs(Math.sin(t*8))*8:0),hP*(L.teint?1:1.05),{flip:true,t:L.teint?L:null,rot,alpha:p1==='hurt'&&Math.floor(t*20)%2?.55:1})}
    else{const k1=fin&&this.res.w===1?'g_victoire':GP[p1]||'g_garde';if(!perso(c,k1,x1,y,hP,{flip:true,t:L,alpha:p1==='hurt'&&Math.floor(t*20)%2?.55:1}))dessinGlad(c,x1,y,s,L,{dir:-1,pose:p1,t,joie:fin&&this.res.w===1})}
    c.restore();
    drawFloats(c,this.fl,dt);
  },
  passer(){
    if(!this.actif)return;
    for(;this.i<this.res.ev.length;this.i++){const e=this.res.ev[this.i];if(!e._ok){e._ok=true;this.appliquer(e,true)}}
    this.majHP();this.log('…');
  },
  fin(){
    const g=S.g,L=g.L,lg=LIGUES[L],v=this.res.w===0;
    let html,apres=null;
    if(v){
      g.wins++;const gain=Math.round(recompense(L,S.cycle)*multSest());S.sest+=gain;g.f++;g.adv=null;
      let extra='';
      if(g.f>=lg.f.length){
        const b=Math.round(recompense(L,S.cycle)*4*multSest());S.sest+=b;this.primeL=b;S.fam.won[L]=true;if(!(S.trophees||(S.trophees=[])).includes(L)){S.trophees.push(L);this.trophee=L}g.L++;g.f=0;g.ligueGagnees++;g.meilleure=Math.max(g.meilleure,g.L);
        extra=`<p style="text-align:center"><b>${lg.nom} won!</b></p>${this.trophee===L?`<div class="gain defi-ok"><span>New trophy: ${esc(lg.boss)}</span>${ASSETS['tf_'+L]?`<img src="${ASSETS['tf_'+L]}" alt="" style="height:46px;width:auto;filter:drop-shadow(1px 2px 1px rgba(60,30,10,.35))">`:'<b>★</b>'}</div>`:''}`;this.trophee=null;
        apres=g.L>=LIGUES.length?'champion':'ligue';
      }
      html=`<h2 style="color:var(--laurier)">Victory!</h2><div class="bulle" style="margin-left:10px">“${esc(ligne('vic'))}”</div>${primeHumour(gain+(this.primeL||0),this.primeL?'Victory and league bonus':'Victory bonus')}${extra}`;this.primeL=0;
    }else{
      g.defaites++;g.f=0;g.dernierVainqueur=this.a.nom;g.parRival=!!this.a.rival;g.adv=null;const gain=Math.round(recompense(L,S.cycle)*.25*multSest());S.sest+=gain;
      const fini=g.defaites>=maxDefaites();if(!fini)nouvelleSerie();
      html=`<h2 style="color:var(--pourpre)">Defeat…</h2><div class="bulle" style="margin-left:10px">“${esc(ligne('def'))}”</div><div class="gains"><div class="gain"><span>Consolation (after ambulance fees)</span><b>+${gain}</b></div><div class="gain"><span>Defeats</span><b>${g.defaites} / ${maxDefaites()}</b></div></div><p>${fini?'One defeat too many. Retirement time has come.':`Back to the first fight of the league. A new run of ${nrjMax()} sessions begins.`}</p>`;
      apres=fini?'retraite':'defaite';
    }
    if(this.a.rival){if(v)S.rival.def++;else S.rival.vic++;html+=`<div class="gain" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="note">${esc(this.a.nom)}</span><span style="font-style:italic">“${esc(repliqueRival(v?'perd':'gagne'))}”</span></div>`}
    guideAvance('combat');
    sauver();
    const el=$('cbCarton');el.innerHTML=`<div class="plaque">${html}<button class="btn" id="cbOk">Continue</button></div>`;el.hidden=false;musique(v?'victoire':'defaite');
    el.querySelector('#cbOk').onclick=()=>{
      el.hidden=true;montrer('ludus');
      if(apres==='champion'){fermerPanneau();champion();return}
      if(apres==='defaite'){fermerPanneau();COUR.flash='entr';COUR.flashT=performance.now()+2500;setTimeout(()=>toast(`New run: ${S.g.nrj} sessions. Training can resume!`,2800),250);bulle(ligne('def'))}
      else ouvrirDirect('arene');
      if(apres==='retraite')retraite('Three defeats',`After his ${['','1st','2nd','3rd'][maxDefaites()]||maxDefaites()+'th'} defeat, ${esc(g.prenom)} hangs up his sword. The ludus thanks him for his service and his many falls.`);
      else{const e=peutEvenement(apres==='ligue'?'ligue':'defaite');if(e)jouerEvenement(e)}
    };
  }
};

/* ===== Écran titre, tuto, dev ===== */
function animTitre(ts){
  if($('titre').hidden)return;
  const cv=$('titreCv'),c=cv.getContext('2d'),W=cv.width,H=cv.height,t=ts/1000;
  c.clearRect(0,0,W,H);
  const a={tunique:'#B23A48',plumet:'#E9A93A',peau:'#E0A97E',bouclier:'#3E78A8',casque:0,trait:'fanfaron'};
  const b={tunique:'#3E78A8',plumet:'#C2452D',peau:'#C68858',bouclier:'#8E2436',casque:1,trait:'coquet'};
  const p=(Math.sin(t*2.2)+1)/2;
  dessinGlad(c,W*.26+p*10,H*.95,1.7,a,{pose:p>.85?'attack':'idle',t});
  dessinGlad(c,W*.74-(1-p)*10,H*.95,1.7,b,{pose:p<.15?'attack':'idle',t,dir:-1});
  c.save();c.translate(W/2,H*.42+Math.sin(t*3)*6);c.rotate(Math.sin(t*1.5)*.3);
  c.strokeStyle=INK;c.lineWidth=3;ell(c,0,0,42,15,'#D99A4A');
  c.strokeStyle='#F3D9A8';c.lineWidth=2.5;for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(i*14-5,-8);c.lineTo(i*14+5,8);c.stroke()}
  c.restore();
  requestAnimationFrame(animTitre);
}
function tuto(){
  const P=[
    ['Welcome to the ludus','You run a family of gladiators. Train your champion with mini-games, send him into the arena, and when he retires, his heir takes over, with more potential than him.'],
    ['Train, then fight','Your gladiator trains in runs of 5 sessions: each mini-game raises one stat, plus a small bonus elsewhere. Then it’s off to the arena, where he fights automatically until he loses. Each defeat sends him back to the first fight of the league and starts a new run. On the third, he retires.'],
    ['The inheritance','At each retirement, you pick the two stats whose potential rises for the heir. He can keep his parent’s passive or try a new one, and he has a personality all his own. Ludus upgrades are yours forever. Goal: win the Colosseum, despite the rival house.']
  ];let i=0;
  const rend=()=>modal(`<h2>${P[i][0]}</h2><p>${P[i][1]}</p><div style="display:flex;gap:6px;justify-content:center">${P.map((_,j)=>`<i style="width:10px;height:10px;border-radius:50%;background:${j===i?'var(--pourpre)':'#C9A86A'};display:block"></i>`).join('')}</div><button class="btn" id="tNext">${i<P.length-1?'Next':'Get to work!'}</button>`,m=>{m.querySelector('#tNext').onclick=()=>{i++;if(i>=P.length){S.tuto=true;sauver();fermerModal();if(!S.introVue)presentation();else bulle(ligne('idle'))}else rend()}});
  rend();
}
function devPanel(){if(S)S.dev=false;
  let d=document.querySelector('.dev');
  if(!S.dev){if(d)d.remove();return}
  if(d)return;
  d=document.createElement('div');d.className='dev';
  const B=[['+500 sest',()=>{S.sest+=500}],['Sessions',()=>{S.g.nrj=nrjMax()}],['+10 stats',()=>{STATS.forEach(k=>plus(S.g,k,10))}],['Caps',()=>{STATS.forEach(k=>S.g.stats[k]=S.fam.caps[k])}],['Victory',()=>{Combat.forceWin=true;toast('Next fight won')}],['Event',()=>{jouerEvenement(pick(EVTS))}],['Traces',()=>{['oie','lion','fans','sponsor'].forEach(trace)}],['Retire',()=>{retraite('Test','Forced retirement (test mode).')}]];
  B.forEach(([l,f])=>{const b=document.createElement('button');b.className='btn clair';b.textContent=l;b.onclick=()=>{f();sauver();rendreLudus()};d.appendChild(b)});
  $('ludus').appendChild(d);
}
function demarrerJeu(){
  if(!S.fam){nouvelleFamille();nouveauGladiateur();sauver()}
  montrer('ludus');onglet=null;rendreLudus();bulle(ligne('idle'));
  if(!S.tuto)tuto();else if(!S.introVue)presentation();
}
/* ---------- bouton retour du téléphone (voir ks-back.js, ajouté par build.py) ----------
   fenêtre ou panneau ouvert → fermé ; cour du ludus → écran titre (confirmé) ; écran titre → hub (confirmé) ;
   entraînement ou combat en cours : ignoré. Les fenêtres qui demandent un choix restent ouvertes. */
function retourTitre(){fermerModal();fermerPanneau();montrer('titre');$('bJouer').textContent='Continue';$('bReset').hidden=false;requestAnimationFrame(animTitre)}
function boutonRetour(){
  const m=$('modal');
  if(!m.hidden){
    for(const id of ['kNon','nFerme','rNon']){const b=m.querySelector('#'+id);if(b){b.click();return}}
    if(m.querySelector('#oTitre'))fermerModal();
    return;
  }
  if(!$('titre').hidden){modal(`<h2>Leave Baffus Maximus?</h2><p>Your dynasty is saved. You will find the other Keismey Studio games on the hub.</p><button class="btn" id="kOui">Go to the hub</button><button class="btn clair petit" id="kNon">Cancel</button>`,
    b=>{b.querySelector('#kNon').onclick=fermerModal;b.querySelector('#kOui').onclick=()=>{fermerModal();KSBack.toHub()}});return}
  if(!$('mg').hidden){toast('Finish the session first.');return}
  if(!$('combat').hidden){toast('Finish the fight first.');return}
  if(!$('sheet').hidden){fermerPanneau();return}
  modal(`<h2>Back to the title screen?</h2><p>Your dynasty is saved.</p><button class="btn" id="kOui">Title screen</button><button class="btn clair petit" id="kNon">Cancel</button>`,
    b=>{b.querySelector('#kNon').onclick=fermerModal;b.querySelector('#kOui').onclick=retourTitre});
}
if(window.KSBack)KSBack.init({back:boutonRetour,lang:()=>LANG==='en'?'en':'fr',title:()=>!$('titre').hidden&&$('modal').hidden});
function boot(){
  S=charger()||nouvelEtat();migrer();traduireSauvegarde();
  if(S.g&&S.g.retraite){/* reprise d'une retraite interrompue */}
  $('bJouer').textContent=S.fam?'Continue':'Play';
  $('bReset').hidden=!S.fam;
  notesMajAuto();
  $('bJouer').onclick=()=>{sfx('tap');demarrerJeu();if(S.g&&S.g.retraite)setTimeout(S.g.heritageFait?revelerHeritier:choixHeritage,50);else if(S.g&&S.g.L>=LIGUES.length)setTimeout(champion,50)};
  $('bReset').onclick=()=>modal(`<h2>New dynasty?</h2><p>All progress will be erased: family, upgrades, hall of champions.</p><button class="btn" id="rNon">Keep my game</button><button class="btn clair petit" id="rOui">Erase everything</button>`,m=>{m.querySelector('#rNon').onclick=fermerModal;m.querySelector('#rOui').onclick=()=>{const dev=S.dev;S=nouvelEtat();S.dev=dev;sauver();fermerModal();$('bJouer').textContent='Play';$('bReset').hidden=true}});
  
  $('mgCv').addEventListener('pointerdown',e=>{e.preventDefault();MG.gDown(e)});
  $('mgCv').addEventListener('pointermove',e=>MG.gMove(e));
  ['pointerup','pointercancel'].forEach(t=>$('mgCv').addEventListener(t,e=>MG.gUp(e)));
  $('mgQuit').onclick=()=>MG.quitter();
  document.querySelectorAll('.cbctl [data-v]').forEach(b=>b.onclick=()=>{Combat.v=+b.dataset.v;document.querySelectorAll('.cbctl [data-v]').forEach(x=>x.classList.toggle('on',x===b))});
  $('cbSkip').onclick=()=>Combat.passer();
  window.addEventListener('keydown',e=>{
    if(!$('mg').hidden&&MG.actif&&MG.cur){if(MG.cur.key&&e.key.startsWith('Arrow')){MG.cur.key(e.key);e.preventDefault()}else if(e.key===' '||e.key==='Enter'){MG.cur.tap(MG.cur._W/2,MG.cur._H/2);e.preventDefault()}}
  });
  setInterval(tickTopbar,1000);
  requestAnimationFrame(dessinCour);
  $('courCv').addEventListener('pointerdown',tapCour);
  $('sheetX').onclick=fermerPanneau;$('panneau').addEventListener('scroll',majDefil,{passive:true});$('defil').onclick=()=>$('panneau').scrollBy({top:$('panneau').clientHeight*.7,behavior:'smooth'});$('defilH').onclick=()=>$('panneau').scrollBy({top:-$('panneau').clientHeight*.7,behavior:'smooth'});$('bOpt').onclick=()=>{sfx('tap');options()};$('voile').onclick=fermerPanneau;
  $('barreG').onclick=()=>{sfx('tap');if(onglet==='fiche')fermerPanneau();else ouvrirPanneau('fiche')};
  const sp=$('splash');
  setTimeout(()=>sp.classList.add('pret'),1100);
  sp.onclick=()=>{if(sp.dataset.parti)return;sp.dataset.parti=1;sp.style.opacity=0;$('titre').hidden=false;musique('titre');requestAnimationFrame(animTitre);setTimeout(()=>sp.hidden=true,300)};
}
boot();

</script>

<script>
/* Hors ligne : service worker ; une nouvelle version propose de recharger */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const propose=w=>{
        if(document.querySelector('.maj'))return;
        const d=document.createElement('div');d.className='toast maj';d.style.cssText='display:flex;gap:10px;align-items:center;pointer-events:auto;z-index:99';
        d.innerHTML='<span>New version available</span><button class="btn or petit">Update</button>';
        d.querySelector('button').onclick=()=>{w.postMessage('skip')};(document.getElementById('app')||document.body).appendChild(d);
      };
      if(reg.waiting&&navigator.serviceWorker.controller)propose(reg.waiting);
      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
        w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)propose(w)})});
    }).catch(()=>{});
    let recharge=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(recharge)return;recharge=true;location.reload()});
  });
}
